# Keep ethernet usable on a direct cable (no DHCP server, no router).
#
# With nothing to answer DHCP and no router advertisement, both address
# families come up empty, so NetworkManager's default wired profile fails
# activation with 'ip-config-unavailable' after its 45s DHCP timeout, tears
# eth0's addresses down -- the IPv6 link-local one included -- and immediately
# re-activates, forever. Every teardown takes avahi's published records with
# it, so <hostname>.local and the runner panel flap in and out of existence for
# minutes at a time.
#
# The clean fix for this is ipv4.link-local=fallback, but that value needs
# NetworkManager >= 1.52 and bookworm ships 1.42.4, where it is silently
# ignored. So instead stop the DHCP transaction from ever timing out:
# activation never fails, NetworkManager never tears eth0 down, the IPv6
# link-local address stays up and avahi keeps publishing. A real DHCP server is
# still honoured the moment one answers.
#
# 2147483647 = MAXINT32 = infinity, per nm-settings(5).
#
# Trade-offs against the trixie variant:
#   - no IPv4 link-local address, so no A record is published and the device is
#     reachable over IPv6 only on a direct link. macOS clients additionally pay
#     a fixed ~5s getaddrinfo() penalty resolving a link-local-only .local name.
#   - eth0 stays in 'connecting' rather than reaching 'connected', so
#     NetworkManager-wait-online blocks for its full timeout at boot when no
#     DHCP server is present. It already does that today, since activation
#     currently fails outright, so this is not a regression.
[connection-ethernet-linklocal]
match-device=type:ethernet
ipv4.dhcp-timeout=2147483647

# Untested on 1.42: if `nmcli con mod <profile> ipv4.link-local enabled` is
# accepted there rather than rejected, setting it here would publish an A
# record too and close the macOS resolution gap. Verify on a real image before
# enabling -- an unsupported value may invalidate this entire section and take
# the dhcp-timeout above with it.
#ipv4.link-local=enabled
