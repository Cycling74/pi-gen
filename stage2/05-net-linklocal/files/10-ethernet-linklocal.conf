# Keep ethernet usable on a direct cable (no DHCP server, no router).
#
# With nothing to answer DHCP and no router advertisement, both address
# families come up empty, so NetworkManager's default wired profile fails
# activation with 'ip-config-unavailable' after its 45s DHCP timeout, tears
# eth0's addresses down -- the IPv6 link-local one included -- and immediately
# re-activates, forever. Every teardown takes avahi's published records with
# it, so <hostname>.local and the runner panel flap in and out of existence for
# minutes at a time.
#
# 'fallback' assigns a 169.254.0.0/16 address only when no other IPv4 address
# could be obtained. Activation then succeeds and the loop stops. DHCP is still
# preferred wherever a server exists, and the link-local address is dropped
# again as soon as a lease arrives.
#
# Needs NetworkManager >= 1.52 (trixie ships 1.52.1). On bookworm (1.42) this
# value is silently ignored -- that image uses a different workaround, see the
# xnor/rnbo-*-bookworm branch.
[connection-ethernet-linklocal]
match-device=type:ethernet
ipv4.link-local=fallback
