# Keep ethernet usable on a direct cable (no DHCP server, no router).
#
# With nothing to answer DHCP and no router advertisement, both address
# families come up empty, so NetworkManager's default wired profile fails
# activation with 'ip-config-unavailable' after its 45s DHCP timeout, tears the
# interface's addresses down -- the IPv6 link-local one included -- and
# immediately re-activates, forever. Every teardown takes avahi's published
# records with it, so <hostname>.local and the runner panel flap in and out of
# existence for minutes at a time.
#
# An infinite DHCP timeout is what stops that: the transaction never expires, so
# activation never fails and the interface is never flushed. A real DHCP server
# is still honoured the moment one answers, on any network.
# 2147483647 = MAXINT32 = infinity, per nm-settings(5).
#
# The infinite timeout is load bearing on every version, and it is not a
# substitute for the link-local setting -- tested on 1.52.1, an
# ipv4.link-local value on its own does NOT rescue the activation: it assigns
# the 169.254 address, but the ipv4 method still fails at the DHCP timeout and
# the connection fails with it. You need both settings.
#
# ipv4.link-local=enabled is this version's equivalent of trixie's
# link-local=fallback, and supplies the 169.254 address -- and so the A record
# avahi publishes, which is what lets a client resolve <hostname>.local without
# a link-local-only answer. Verified on NetworkManager 1.42.4: `enabled` does
# NOT add an address alongside a working DHCP lease, so on an ordinary network
# the interface just takes its lease; but on a link where DHCP never succeeds
# the address does appear, which is exactly the direct-cable case. The two
# images therefore spell it differently to get the same behaviour: `fallback`
# on 1.52+, `enabled` here.
#
# Cost: the interface stays in state 70 (connecting) rather than reaching 100
# (connected), so NetworkManager-wait-online blocks for its full timeout at boot
# when no DHCP server is present. It already does that today, since activation
# currently fails outright, so this is not a regression.
#
# NOTE the numeric value below. NetworkManager's connection defaults parse enum
# properties by number, not by name: `ipv4.link-local=enabled` here is accepted
# without complaint and silently does nothing, which looks exactly like the
# feature being unsupported. Verified on 1.52.1 -- with the name the interface
# came up with no ipv4 address at all; with `3` it gets its 169.254 address.
# The dhcp-timeout above is an int, so it was never affected, which is why half
# of this file appeared to work.
# 0 = default, 1 = auto, 2 = disabled, 3 = enabled, 4 = fallback.
[connection-ethernet-linklocal]
match-device=type:ethernet
ipv4.dhcp-timeout=2147483647
ipv4.link-local=3
