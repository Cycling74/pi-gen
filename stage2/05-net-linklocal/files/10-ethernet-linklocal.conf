# Keep ethernet usable on a direct cable (no DHCP server, no router).
#
# With nothing to answer DHCP and no router advertisement, both address
# families come up empty, so NetworkManager's default wired profile fails
# activation with 'ip-config-unavailable' after its 45s DHCP timeout, tears
# eth0's addresses down -- the IPv6 link-local one included -- and immediately
# re-activates, forever. Every teardown takes avahi's published records with
# it, so <hostname>.local and the runner panel flap in and out of existence for
# minutes at a time.
#
# Both settings below are needed, and the order of reasoning matters:
#
# ipv4.dhcp-timeout is what actually stops the teardown. Verified on NM 1.52.1:
# ipv4.link-local=fallback alone does NOT rescue the activation. The 169.254
# address is assigned, but when the 45s DHCP timeout expires the ipv4 method
# still fails, ipv6.method=auto still has no router advertisement to work with,
# and with both families failed NetworkManager fails the connection --
# 'Connection activation failed: IP configuration could not be reserved'. With
# an infinite timeout the DHCP transaction never expires, so activation never
# fails and the interface is never flushed.
#
# ipv4.link-local=fallback then adds a 169.254.0.0/16 address, so avahi
# publishes an A record alongside the AAAA. Without it the device is reachable
# over IPv6 only, and macOS clients additionally pay a fixed ~5s getaddrinfo()
# penalty resolving a link-local-only .local name. Needs NM >= 1.52; trixie
# ships 1.52.1, bookworm ships 1.42.4 and silently ignores the value.
#
# Cost: eth0 stays in state 70 (connecting) instead of reaching 100
# (connected), since DHCP is forever pending, so NetworkManager-wait-online
# blocks for its full timeout at boot when no DHCP server is present. It
# already does that today, because activation currently fails outright, so this
# is not a regression -- but it is worth shortening that timeout if boot time
# on a direct link matters.
#
# A real DHCP server is still honoured the moment one answers, on any network.
#
# NOTE the numeric value below. NetworkManager's connection defaults parse enum
# properties by number, not by name: `ipv4.link-local=fallback` here is accepted
# without complaint and silently does nothing, which looks exactly like the
# feature being unsupported. Verified on 1.52.1 -- with the name the interface
# came up with no ipv4 address at all; with `4` it gets its 169.254 address.
# The dhcp-timeout above is an int, so it was never affected, which is why half
# of this file appeared to work.
# 0 = default, 1 = auto, 2 = disabled, 3 = enabled, 4 = fallback.
[connection-ethernet-linklocal]
match-device=type:ethernet
ipv4.dhcp-timeout=2147483647
ipv4.link-local=4
