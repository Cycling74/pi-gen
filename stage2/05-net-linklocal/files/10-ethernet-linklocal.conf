# Keep ethernet usable on a direct cable (no DHCP server, no router).
#
# With nothing to answer DHCP and no router advertisement, both address
# families come up empty, so NetworkManager's default wired profile fails
# activation with 'ip-config-unavailable' after its 45s DHCP timeout, tears
# eth0's addresses down -- the IPv6 link-local one included -- and immediately
# re-activates, forever. Every teardown takes avahi's published records with
# it, so <hostname>.local and the runner panel flap in and out of existence for
# minutes at a time.
#
# An infinite DHCP timeout is what stops it: the transaction never expires, so
# activation never fails and the interface is never flushed. A real DHCP server
# is still honoured the moment one answers, on any network.
#
# This is not merely a workaround for old NetworkManager. Tested on 1.52.1,
# ipv4.link-local=fallback on its own does NOT rescue the activation -- it
# assigns the 169.254 address, but the ipv4 method still fails at the DHCP
# timeout and the connection fails with it. The infinite timeout is the load
# bearing part on every version; the trixie branch pairs it with
# link-local=fallback purely for the A record, which bookworm's 1.42.4 cannot
# do since it has no fallback mode.
#
# 2147483647 = MAXINT32 = infinity, per nm-settings(5).
#
# Costs on this image:
#   - no IPv4 link-local address, so no A record: the device is reachable over
#     IPv6 only on a direct link, and macOS clients pay a fixed ~5s
#     getaddrinfo() penalty resolving a link-local-only .local name.
#   - eth0 stays in state 70 (connecting) rather than reaching 100 (connected),
#     so NetworkManager-wait-online blocks for its full timeout at boot when no
#     DHCP server is present. It already does that today, since activation
#     currently fails outright, so this is not a regression.
[connection-ethernet-linklocal]
match-device=type:ethernet
ipv4.dhcp-timeout=2147483647
